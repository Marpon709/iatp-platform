<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>IATP · 地图服务配置</title><link rel="stylesheet" href="/desktop.css"><script src="/settings.js" defer></script></head><body><main class="setup"><div class="brand">IATP <span>南京</span></div><h1>连接地图服务</h1><p>填写自己的服务 Key，用于新地点检索和交通路线计算。</p><form id="configuration"><label for="tianditu">天地图服务 Key</label><input id="tianditu" type="password" autocomplete="off" spellcheck="false" maxlength="256"><label for="amap">高德 Web 服务 Key</label><input id="amap" type="password" autocomplete="off" spellcheck="false" maxlength="256"><p class="hint">配置保存在当前 Windows 账户中。可随时从“文件 → 地图服务配置”修改。</p><div id="feedback" role="status"></div><div class="actions"><button type="submit">保存并进入软件</button><button id="enter" type="button" class="secondary">稍后配置</button></div></form><footer>活动 · 出行 · 碳预算</footer></main></body></html>
